name: Windows build and tests

on:
  push:
    paths:
      - 'theastrattoengine/**'
      - 'rpggame/**'
      - '.github/workflows/windows-native.yml'
  pull_request:
    paths:
      - 'theastrattoengine/**'
      - 'rpggame/**'
      - '.github/workflows/windows-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Compile with MSVC warnings as errors and run native checks
        working-directory: theastrattoengine
        shell: cmd
        run: native\build.bat
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build game and run Java regressions
        working-directory: rpggame
        shell: cmd
        run: gradlew.bat build --no-daemon --console=plain --max-workers=2
