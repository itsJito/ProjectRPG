name: Windows build and tests

on:
  push:
    paths:
      - 'theastrattoengine/**'
      - 'rpggame/**'
      - '.github/workflows/windows-native.yml'
  pull_request:
    paths:
      - 'theastrattoengine/**'
      - 'rpggame/**'
      - '.github/workflows/windows-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build engine and verify native APIs with MSVC warnings as errors
        working-directory: theastrattoengine
        env:
          ASTRATTO_HEADLESS: '1' # hosted Windows runner has no OpenGL 4.5 GPU; rendering is exercised in the Linux display check
        shell: cmd
        run: gradlew.bat build --no-daemon --console=plain --max-workers=2
      - name: Build game and run Java regressions
        working-directory: rpggame
        shell: cmd
        run: gradlew.bat build --no-daemon --console=plain --max-workers=2
      - name: Verify unchanged launches reuse the native runtime
        working-directory: rpggame
        shell: pwsh
        run: |
          $buildOutput = & .\gradlew.bat :theastrattoengine:jar classes --no-daemon --console=plain --max-workers=2 2>&1
          $buildOutput | ForEach-Object { Write-Output $_ }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (($buildOutput -join "`n") -notmatch ':theastrattoengine:buildNative UP-TO-DATE') {
            throw 'An unchanged launch rebuilt the native runtime.'
          }
